<html lang="es"><head><meta charset="utf-8">

<canvas id="c"></canvas>
<div id="ui">
<button id="mic">A · micrófono</button><label>Cargar canción<input type="file" id="file" accept="audio/*"></label>
<audio id="aud" controls style="display:none;width:100%;margin-bottom:6px"></audio><br>
1 tejido · 2 cicatriz · 3 células · 4 coágulo · <b>5 alma</b><br>

G (mantener): luz roja manual · , . sensibilidad al agudo<br>
